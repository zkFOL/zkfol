[package]
name = "zkfol_zinc_plus"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "zkfol_zinc_plus"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zkfol_verify"
path = "src/bin/zkfol_verify.rs"

[dependencies]
rustler = "0.38"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crypto-bigint = { version = "= 0.7.0-rc.9", features = ["zeroize"] }
crypto-primitives = { git = "https://github.com/NethermindEth/crypto-primitives.git", rev = "9ce6d879a43ae6806612225c95d8b03ce5173b55", features = ["std", "crypto_bigint", "rand"] }
zinc-protocol = { git = "https://github.com/mariari/zinc-plus.git", rev = "5a01924" }
zinc-uair = { git = "https://github.com/mariari/zinc-plus.git", rev = "5a01924" }
zinc-poly = { git = "https://github.com/mariari/zinc-plus.git", rev = "5a01924" }
zinc-utils = { git = "https://github.com/mariari/zinc-plus.git", rev = "5a01924" }
zinc-transcript = { git = "https://github.com/mariari/zinc-plus.git", rev = "5a01924" }
zinc-primality = { git = "https://github.com/mariari/zinc-plus.git", rev = "5a01924" }
zip-plus = { git = "https://github.com/mariari/zinc-plus.git", rev = "5a01924" }

[features]
# simd stays off: binary-poly widening wants avx512, absent on this CPU.
default = ["parallel"]
parallel = ["zinc-protocol/parallel", "zip-plus/parallel"]
simd = ["zinc-protocol/simd", "zip-plus/simd"]

[profile.release]
opt-level = 3

